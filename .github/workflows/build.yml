name: 打包桌面应用
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyinstaller openpyxl xlrd
      - run: pyinstaller --noconsole --onefile --name vehicle-flow --collect-all openpyxl --hidden-import xlrd --clean --noconfirm webapp.py
      - run: dir dist
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-flow-windows
          path: dist/vehicle-flow.exe
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vehicle-flow.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyinstaller openpyxl xlrd
      - run: pyinstaller --windowed --name vehicle-flow --collect-all openpyxl --hidden-import xlrd --clean --noconfirm webapp.py
      - run: ls -R dist
      - name: 打 dmg
        run: |
          mkdir -p /tmp/dmgstage
          cp -R "dist/vehicle-flow.app" /tmp/dmgstage/
          ln -s /Applications /tmp/dmgstage/Applications
          hdiutil create -volname "Vehicle Flow" -srcfolder /tmp/dmgstage -ov -format UDZO "dist/vehicle-flow-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-flow-macos
          path: dist/vehicle-flow-macos.dmg
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vehicle-flow-macos.dmg
